name: Refresh and publish War Room
on:
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'site/**'
      - '.github/workflows/war-room.yml'
concurrency:
  group: prediction-war-room-pages
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .cache
          key: espn-scoreboard-${{ github.run_id }}
          restore-keys: espn-scoreboard-
      - name: Install PDF parser
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Validate and refresh
        run: |
          python -m unittest -v
          node --check site/app.js
          python publish.py
      - name: Archive forecasts and results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m "Archive pregame forecasts and results"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: forecast
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
